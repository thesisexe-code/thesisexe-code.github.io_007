<!--
=== ตั้งค่า Supabase (รัน SQL นี้ใน SQL Editor ครั้งเดียว) ===
create table shop(id int primary key, name text, subtitle text, avatar_url text, banner_url text, qr_url text,
  kbank_no text, kbank_name text, tw_no text, tw_name text, fb_url text, line_url text, highlights jsonb);
create table reviews(id bigint generated always as identity primary key, name text, rating int, body text, image_url text, created_at timestamptz default now());
alter table shop enable row level security; alter table reviews enable row level security;
create policy "อ่านร้าน" on shop for select using (true);
create policy "แอดมินแก้ร้าน" on shop for all to authenticated using (true) with check (true);
create policy "อ่านรีวิว" on reviews for select using (true);
create policy "ทุกคนส่งรีวิว" on reviews for insert with check (rating between 1 and 5 and length(body) < 1000);
create policy "แอดมินลบรีวิว" on reviews for delete to authenticated using (true);
insert into storage.buckets(id,name,public) values('media','media',true);
create policy "ดูรูป" on storage.objects for select using (bucket_id='media');
create policy "ทุกคนอัปโหลดรูปรีวิว" on storage.objects for insert with check (bucket_id='media' and name like 'reviews/%');
create policy "แอดมินอัปโหลดรูปร้าน" on storage.objects for insert to authenticated with check (bucket_id='media');
แล้วสร้างผู้ใช้แอดมิน 1 คนที่ Authentication > Users และปิด "Allow new users to sign up"
-->

:root{--br:#7A5244;--pk:#4DC4A6;--lb:color-mix(in srgb,var(--pk) 45%,#fff);--bg:color-mix(in srgb,var(--pk) 9%,#fff);--t:color-mix(in srgb,var(--pk) 18%,#fff)}
*{box-sizing:border-box;margin:0}
body{font-family:'Prompt',sans-serif;color:var(--br);background:var(--bg) radial-gradient(color-mix(in srgb,var(--pk) 25%,#fff) 1.5px,transparent 1.5px) 0 0/18px 18px;min-height:100vh;padding:0 0 90px}
.wrap{max-width:480px;margin:0 auto;padding:14px}
button,input,textarea{font:inherit;color:inherit}
.card{background:#fff;border-radius:28px;box-shadow:0 6px 20px rgba(122,82,68,.1);padding:18px;margin-bottom:14px}
.btn{font-weight:700;border:0;border-radius:999px;padding:10px 20px;background:var(--br);color:#fff;cursor:pointer}
.btn.pk{background:var(--pk)}.btn.sm{padding:6px 16px;font-size:.9rem}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.theme{white-space:nowrap;display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:8px 14px;margin-bottom:12px;box-shadow:0 4px 14px rgba(122,82,68,.1);font-size:.82rem}
.theme #sw{display:flex;gap:6px;flex:1}.theme #sw button{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ddd;cursor:pointer;padding:0}
.theme label{display:flex;align-items:center;gap:4px}.theme input{width:28px;height:28px;border:0;padding:0;background:none;cursor:pointer}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--pk);margin-right:8px}
.logo{font-size:1.25rem;font-weight:600;color:var(--pk)}
.round{width:42px;height:42px;border-radius:50%;border:0;background:#fff;box-shadow:0 4px 12px rgba(122,82,68,.15);font-size:1.15rem;cursor:pointer}
.banner{height:140px;border-radius:28px;background:linear-gradient(135deg,var(--br),color-mix(in srgb,var(--br) 50%,var(--pk))) center/cover;margin-bottom:0}
.av{color:var(--br);font-weight:600;width:104px;height:104px;border-radius:50%;border:5px solid #fff;background:var(--lb) center/cover;margin:-52px auto 0;position:relative;box-shadow:0 4px 14px rgba(122,82,68,.2);display:grid;place-items:center;font-size:2.4rem}
.name{text-align:center;font-size:1.4rem;font-weight:600;margin-top:8px}
.sub{text-align:center;opacity:.8;margin:2px 0 16px}
.hl{display:flex;justify-content:space-around;gap:8px;margin-bottom:16px}
.hl button{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.82rem}
.hl i{width:66px;height:66px;border-radius:50%;border:2px solid var(--pk);padding:0;display:block;background:var(--t);overflow:hidden}
.hl i b{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--t) center/cover;font-size:1.4rem}
.tabs{display:flex;background:#fff;border-radius:999px;padding:5px;box-shadow:0 4px 14px rgba(122,82,68,.1);margin-bottom:14px}
.tabs button{font-weight:700;flex:1;border:0;border-radius:999px;padding:10px 4px;background:none;cursor:pointer;font-size:.9rem}
.tabs button.on{background:var(--br);color:#fff}
.hide{display:none!important}
.sum{display:flex;align-items:center;justify-content:space-between}
.big{font-size:3rem;font-weight:600;color:var(--pk);line-height:1}
.hearts{color:color-mix(in srgb,var(--pk) 22%,#fff);letter-spacing:2px;font-size:1.1rem}.hearts .f{color:var(--pk)}
.in{width:100%;border:2px solid var(--t);border-radius:18px;padding:10px 14px;background:color-mix(in srgb,var(--pk) 4%,#fff);outline:none;margin-bottom:10px}
.in[type=file]{padding:8px 12px;font-size:.85rem;cursor:pointer}
.in:focus{border-color:var(--pk)}
.pick{display:flex;gap:6px;font-size:1.9rem;margin:2px 0 10px}
.pick span{cursor:pointer;color:color-mix(in srgb,var(--pk) 22%,#fff);transition:transform .15s}.pick span.f{color:var(--pk)}.pick span:active{transform:scale(1.3)}
.cover{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.file{position:relative;display:inline-block;border:2px dashed var(--lb);border-radius:999px;padding:6px 16px;font-size:.9rem;cursor:pointer;margin-bottom:10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv .h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.rv b{font-weight:600}.rv small{opacity:.65;display:block}
.rv p{margin:8px 0;white-space:pre-wrap;word-break:break-word}
.rv img{width:100%;max-height:300px;object-fit:cover;border-radius:18px}
.del{border:0;background:var(--t);border-radius:50%;width:34px;height:34px;cursor:pointer}
.pay h3{font-size:1.05rem;margin-bottom:8px}
.pay .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pay .no{font-size:1.25rem;font-weight:600;letter-spacing:1px}
.qr{width:220px;max-width:100%;aspect-ratio:1;margin:0 auto;border-radius:22px;border:2px dashed var(--lb);display:grid;place-items:center;background:color-mix(in srgb,var(--pk) 4%,#fff) center/contain no-repeat;opacity:.95}
.soc{display:flex;gap:10px}.soc a{flex:1;text-align:center;text-decoration:none;color:#fff;border-radius:999px;padding:12px;font-weight:500}
.music{position:fixed;right:16px;bottom:16px;width:52px;height:52px;font-size:1.4rem;z-index:5}
.music.on{animation:spin 3s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(122,82,68,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.box{background:#fff;border-radius:28px;max-width:440px;width:100%;max-height:88vh;overflow:auto;padding:20px}
.box h2{font-size:1.15rem;margin-bottom:12px}.box label{font-size:.85rem;opacity:.8;display:block;margin:4px 0 2px}
.box img.pop{width:100%;border-radius:20px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--br);color:#fff;padding:10px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;white-space:nowrap}
#toast.on{opacity:1}
.demo{font-size:.78rem;text-align:center;background:var(--t);border-radius:999px;padding:4px 10px;margin-bottom:10px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="theme" id="theme"><b>สีธีม</b><div id="sw"></div><label>หลัก<input type="color" id="c1"></label><label>เสริม<input type="color" id="c2"></label></div>
  <div class="top"><div class="logo"><span class="dot"></span><span id="tName"></span></div><button class="round" id="gear" aria-label="ตั้งค่า">⚙️</button></div>
  <div id="demoNote" class="demo hide">โหมดทดลอง: ข้อมูลเก็บในเครื่องนี้ ใส่ค่า Supabase ในสคริปต์เพื่อบันทึกถาวร</div>
  <div class="banner" id="banner"></div>
  <div class="av" id="av"></div>
  <div class="name" id="name"></div>
  <div class="sub" id="sub"></div>
  <div class="hl" id="hl"></div>

  <div class="tabs"><button class="on" data-t="r">รีวิวจากลูกค้า</button><button data-t="p">ช่องทางชำระเงิน & ติดต่อ</button></div>

  <section id="r">
    <div class="card sum"><div><div class="big" id="avg">0.0</div><div class="hearts" id="avgH"></div></div><div style="text-align:right"><b id="cnt">0</b><br>รีวิว</div></div>
    <div class="card">
      <input class="in" id="rn" placeholder="ชื่อคุณ / ชื่อน้อง" maxlength="40">
      <div class="pick" id="pick"></div>
      <textarea class="in" id="rb" rows="3" placeholder="เล่าความประทับใจ..." maxlength="800"></textarea>
      <label class="file" id="rfl">📷 เลือกรูป<input type="file" id="rf" accept="image/*" class="cover"></label><br>
      <button class="btn" id="send">ส่งรีวิว</button>
    </div>
    <div id="list"></div>
  </section>

  <section id="p" class="hide pay">
    <div class="card" style="text-align:center"><h3>สแกนจ่าย</h3><div class="qr" id="qr"></div></div>
    <div class="card"><h3>🏦 โอนผ่าน KBANK</h3><div class="row"><div><div class="no" id="kn"></div><small id="kna"></small></div><button class="btn pk sm" data-c="kn">คัดลอก</button></div></div>
    <div class="card"><h3>🧡 TrueMoney Wallet</h3><div class="row"><div><div class="no" id="tn"></div><small id="tna"></small></div><button class="btn pk sm" data-c="tn">คัดลอก</button></div></div>
    <div class="soc"><a id="fb" style="background:var(--br)" target="_blank" rel="noopener">Facebook</a><a id="ln" style="background:var(--pk)" target="_blank" rel="noopener">Line</a></div>
  </section>
</div>
<button class="round music" id="music" aria-label="เปิด/ปิดเพลง">🎵</button>
<div id="toast"></div>
<div id="modal" class="modal hide"><div class="box" id="box"></div></div>

<script>
const CFG={url:'',key:'',music:'',picker:true,adminUser:'google.com',adminPass:'311052',sbEmail:'',sbPass:''}; // sbEmail/sbPass = บัญชีแอดมินจริงใน Supabase (ใช้เมื่อต่อ Supabase) // ใส่ Project URL, anon key และลิงก์ไฟล์เพลง (mp3)
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const demo=!CFG.url||typeof supabase==='undefined';
const sb=demo?null:supabase.createClient(CFG.url,CFG.key);
const LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('พื้นที่เก็บข้อมูลเต็ม')}}};
const DEF={name:'ชื่อร้านของคุณ',subtitle:'คำโปรยร้านของคุณ ✨',avatar_url:'',banner_url:'',qr_url:'',kbank_no:'000-0-00000-0',kbank_name:'ชื่อบัญชีของคุณ',tw_no:'000-000-0000',tw_name:'ชื่อบัญชีของคุณ',fb_url:'',line_url:'',highlights:[{name:'1',img:''},{name:'2',img:''},{name:'3',img:''},{name:'4',img:''}]};
const SEED=[{id:3,name:'คุณ C',rating:4,body:'ตัวอย่างรีวิว: ติดต่อง่าย ได้ของตามนัด จะกลับมาอุดหนุนอีกค่ะ',image_url:'',created_at:'2026-11-08T10:00:00Z'},{id:2,name:'น้อง B',rating:5,body:'ตัวอย่างรีวิว: แม่ค้าตอบไว ใจดีมาก ประทับใจสุดๆ',image_url:'',created_at:'2026-11-05T10:00:00Z'},{id:1,name:'คุณ A',rating:5,body:'ตัวอย่างรีวิว: ของมาไว แพ็คดี ตรงปกค่ะ',image_url:'',created_at:'2026-11-02T10:00:00Z'}];
let shop=DEF,reviews=[],admin=false,rating=0,music=null;

const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),1800)};
const thDate=d=>new Date(d).toLocaleDateString('th-TH-u-ca-buddhist',{day:'numeric',month:'long',year:'numeric'});
const hearts=n=>[1,2,3,4,5].map(i=>`<span class="${i<=Math.round(n)?'f':''}">♥</span>`).join('');
const shrink=(f,max=900)=>new Promise((res,rej)=>{
  const fr=new FileReader();
  fr.onerror=()=>rej(new Error('read'));
  fr.onload=()=>{const i=new Image();
    i.onerror=()=>rej(new Error('img'));
    i.onload=()=>{try{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))}catch(e){res(fr.result)}};
    i.src=fr.result};
  fr.readAsDataURL(f)});
const toBlob=d=>{const p=d.split(','),m=p[0].match(/:(.*?);/)[1],bin=atob(p[1]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:m})};
async function upload(f,dir){
  if(!f)return null;const d=await shrink(f);
  if(demo)return d;
  const p=dir+'/'+Date.now()+Math.random().toString(36).slice(2,7)+'.jpg';
  const {error}=await sb.storage.from('media').upload(p,toBlob(d),{contentType:'image/jpeg'});if(error)throw error;
  return sb.storage.from('media').getPublicUrl(p).data.publicUrl;
}

async function load(){
  try{
    if(demo){shop={...DEF,...LS.get('shop',{})};reviews=LS.get('reviews',SEED);admin=LS.get('admin',false)}
    else{
      const a=await sb.from('shop').select('*').eq('id',1).maybeSingle();shop={...DEF,...(a.data||{})};
      const b=await sb.from('reviews').select('*').order('created_at',{ascending:false});reviews=b.data||[];
      admin=!!(await sb.auth.getSession()).data.session;
    }
  }catch(e){toast('โหลดข้อมูลไม่สำเร็จ')}
  draw();
}

function draw(){
  $('#demoNote').classList.toggle('hide',!demo);
  $('#tName').textContent=shop.name;$('#name').textContent=shop.name;$('#sub').textContent=shop.subtitle;
  document.title=shop.name;
  $('#banner').style.backgroundImage=shop.banner_url?`url("${shop.banner_url}")`:'';
  const av=$('#av');av.style.backgroundImage=shop.avatar_url?`url("${shop.avatar_url}")`:'';av.textContent=shop.avatar_url?'':[...shop.name.trim()][0]||'';
  $('#hl').innerHTML=shop.highlights.slice(0,4).map((h,i)=>`<button data-h="${i}"><i><b style="${h.img?`background-image:url('${esc(h.img)}')`:''}"></b></i>${esc(h.name)}</button>`).join('');
  const n=reviews.length,avg=n?reviews.reduce((s,r)=>s+r.rating,0)/n:0;
  $('#avg').textContent=avg.toFixed(1);$('#avgH').innerHTML=hearts(avg);$('#cnt').textContent=n;
  $('#list').innerHTML=n?reviews.map(r=>`<div class="card rv"><div class="h"><div><b>${esc(r.name)}</b><small>${thDate(r.created_at)}</small><div class="hearts">${hearts(r.rating)}</div></div>${admin?`<button class="del" data-d="${r.id}" aria-label="ลบรีวิว">🗑️</button>`:''}</div><p>${esc(r.body)}</p>${r.image_url?`<img src="${esc(r.image_url)}" alt="รูปรีวิว" loading="lazy">`:''}</div>`).join(''):'<div class="card" style="text-align:center">ยังไม่มีรีวิว เป็นคนแรกที่เขียนให้ร้านเลย 💕</div>';
  const q=$('#qr');q.style.backgroundImage=shop.qr_url?`url("${shop.qr_url}")`:'';q.textContent=shop.qr_url?'':'ยังไม่มี QR Code';
  $('#kn').textContent=shop.kbank_no;$('#kna').textContent=shop.kbank_name;$('#tn').textContent=shop.tw_no;$('#tna').textContent=shop.tw_name;
  for(const [id,u] of [['fb',shop.fb_url],['ln',shop.line_url]]){const a=$('#'+id);if(u)a.href=u;else a.removeAttribute('href')}
}

// แท็บ
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  $('#r').classList.toggle('hide',b.dataset.t!=='r');$('#p').classList.toggle('hide',b.dataset.t!=='p');
});
// ให้คะแนน
const pick=$('#pick');pick.innerHTML=[1,2,3,4,5].map(i=>`<span data-v="${i}" role="button" aria-label="${i} ดวง">♥</span>`).join('');
pick.onclick=e=>{const v=+e.target.dataset.v;if(!v)return;rating=v;[...pick.children].forEach((s,i)=>s.classList.toggle('f',i<v))};
$('#rf').onchange=e=>{$('#rfl').childNodes[0].nodeValue='📷 '+(e.target.files[0]?.name||'เลือกรูป')};
// ส่งรีวิว
$('#send').onclick=async()=>{
  const name=$('#rn').value.trim(),body=$('#rb').value.trim();
  if(!name||!rating||!body)return toast('กรอกชื่อ ให้คะแนน และเขียนข้อความก่อนนะ');
  const btn=$('#send');btn.disabled=true;btn.textContent='กำลังส่ง...';
  try{
    const image_url=await upload($('#rf').files[0],'reviews');
    const row={name,rating,body,image_url};
    if(demo){reviews.unshift({...row,id:Date.now(),created_at:new Date().toISOString()});LS.set('reviews',reviews)}
    else{const {error}=await sb.from('reviews').insert(row);if(error)throw error;
      reviews=(await sb.from('reviews').select('*').order('created_at',{ascending:false})).data||[]}
    $('#rn').value=$('#rb').value='';$('#rf').value='';$('#rfl').childNodes[0].nodeValue='📷 เลือกรูป';rating=0;[...pick.children].forEach(s=>s.classList.remove('f'));
    draw();toast('ส่งรีวิวแล้ว ขอบคุณค่ะ 💕');
  }catch(e){toast(e.message==='img'?'ไฟล์รูปนี้ใช้ไม่ได้ ลองรูป JPG/PNG':'ส่งไม่สำเร็จ: '+(e.message||'ลองใหม่'))}
  btn.disabled=false;btn.textContent='ส่งรีวิว';
};
// ลบรีวิว
$('#list').onclick=async e=>{
  const id=e.target.closest('[data-d]')?.dataset.d;if(!id||!admin||!confirm('ลบรีวิวนี้?'))return;
  if(demo){reviews=reviews.filter(r=>r.id!=id);LS.set('reviews',reviews)}
  else{const {error}=await sb.from('reviews').delete().eq('id',id);if(error)return toast('ลบไม่สำเร็จ');reviews=reviews.filter(r=>r.id!=id)}
  draw();toast('ลบรีวิวแล้ว');
};
// คัดลอก
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=async()=>{
  const t=$('#'+b.dataset.c).textContent.replace(/[^0-9]/g,'');
  try{await navigator.clipboard.writeText(t)}catch(e){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}
  toast('คัดลอกแล้ว ✓');
});
document.querySelectorAll('.soc a').forEach(a=>a.onclick=e=>{if(!a.href)toast('ร้านยังไม่ได้ตั้งลิงก์')});
// ไฮไลต์
const modal=$('#modal'),box=$('#box');
const open=h=>{box.innerHTML=h;modal.classList.remove('hide')};
modal.onclick=e=>{if(e.target===modal)modal.classList.add('hide')};
$('#hl').onclick=e=>{
  const i=e.target.closest('[data-h]')?.dataset.h;if(i==null)return;const h=shop.highlights[i];
  open(`<h2>${esc(h.name)}</h2>${h.img?`<img class="pop" src="${esc(h.img)}" alt="${esc(h.name)}">`:'<p style="text-align:center;padding:30px 0">ยังไม่มีรูปในไฮไลต์นี้</p>'}<br><button class="btn" onclick="modal.classList.add('hide')">ปิด</button>`);
};
// เพลง
$('#music').onclick=()=>{
  if(!CFG.music)return toast('ยังไม่ได้ตั้งค่าเพลง');
  if(!music){music=new Audio(CFG.music);music.loop=true}
  if(music.paused){music.play().then(()=>$('#music').classList.add('on')).catch(()=>toast('เล่นเพลงไม่ได้'))}
  else{music.pause();$('#music').classList.remove('on')}
};
// แอดมิน
$('#gear').onclick=()=>admin?editor():open(`<h2>เข้าสู่ระบบแอดมิน</h2><input class="in" id="ae" type="text" placeholder="อีเมล" autocomplete="username" autocapitalize="none"><input class="in" id="ap" type="password" placeholder="รหัสผ่าน" autocomplete="current-password"><button class="btn" id="login">เข้าสู่ระบบ</button> <button class="btn pk" onclick="modal.classList.add('hide')">ปิด</button>`);
box.onclick=async e=>{
  if(e.target.id==='login'){
    const em=$('#ae').value.trim(),pw=$('#ap').value;if(!em||!pw)return toast('กรอกอีเมลและรหัสผ่าน');
    if(em!==CFG.adminUser||pw!==CFG.adminPass)return toast('อีเมลหรือรหัสผ่านไม่ถูกต้อง');
    if(demo){admin=true;LS.set('admin',true)}
    else{const {error}=await sb.auth.signInWithPassword({email:CFG.sbEmail,password:CFG.sbPass});if(error)return toast('เชื่อมต่อบัญชีแอดมินไม่สำเร็จ');admin=true}
    draw();editor();toast('เข้าสู่ระบบแล้ว');
  }
  if(e.target.id==='logout'){if(!demo)await sb.auth.signOut();admin=false;LS.set('admin',false);modal.classList.add('hide');draw();toast('ออกจากระบบแล้ว')}
  if(e.target.id==='save')save(e.target);
};
function editor(){
  const f=(id,l,v)=>`<label>${l}</label><input class="in" id="e_${id}" value="${esc(v)}">`;
  const fl=(id,l)=>`<label>${l}</label><input class="in" type="file" id="e_${id}" accept="image/*">`;
  open(`<h2>แก้ไขข้อมูลร้าน</h2>${f('name','ชื่อร้าน',shop.name)}${f('subtitle','ข้อความใต้ชื่อ',shop.subtitle)}${fl('avatar','รูปโปรไฟล์')}${fl('banner','แบนเนอร์')}${fl('qr','QR Code')}
  ${f('kbank_no','เลขบัญชี KBANK',shop.kbank_no)}${f('kbank_name','ชื่อบัญชี KBANK',shop.kbank_name)}${f('tw_no','เบอร์ TrueMoney',shop.tw_no)}${f('tw_name','ชื่อบัญชี TrueMoney',shop.tw_name)}${f('fb_url','ลิงก์ Facebook',shop.fb_url)}${f('line_url','ลิงก์ Line',shop.line_url)}
  ${shop.highlights.map((h,i)=>`${f('hn'+i,'ไฮไลต์ '+(i+1)+' ชื่อ',h.name)}${fl('hi'+i,'ไฮไลต์ '+(i+1)+' รูป')}`).join('')}
  <button class="btn" id="save">บันทึก</button> <button class="btn pk" id="logout">ออกจากระบบ</button>`);
}
async function save(btn){
  btn.disabled=true;btn.textContent='กำลังบันทึก...';
  const v=id=>$('#e_'+id).value.trim(),fi=id=>$('#e_'+id).files[0];
  try{
    const n={...shop};
    for(const k of ['name','subtitle','kbank_no','kbank_name','tw_no','tw_name','fb_url','line_url'])n[k]=v(k);
    for(const [k,id,d] of [['avatar_url','avatar','shop'],['banner_url','banner','shop'],['qr_url','qr','shop']])if(fi(id))n[k]=await upload(fi(id),d);
    n.highlights=await Promise.all(shop.highlights.map(async(h,i)=>({name:v('hn'+i),img:fi('hi'+i)?await upload(fi('hi'+i),'shop'):h.img})));
    if(demo)LS.set('shop',n);else{const {error}=await sb.from('shop').upsert({id:1,...n});if(error)throw error}
    shop=n;draw();modal.classList.add('hide');toast('บันทึกแล้ว ✓');
  }catch(e){toast(e.message==='img'?'ไฟล์รูปนี้ใช้ไม่ได้ ลองรูป JPG/PNG':'บันทึกไม่สำเร็จ: '+(e.message||''));btn.disabled=false;btn.textContent='บันทึก'}
}
const THEMES=[['ช็อคมิ้นต์','#7A5244','#4DC4A6'],['สตรอว์เบอร์รีนม','#7D4E57','#FF8FAB'],['พีชครีม','#8A5A44','#FFA07A'],['ลาเวนเดอร์','#6E5A8F','#B79CED'],['เบบี้บลู','#5B7A99','#6FB7F0'],['เลมอนนม','#8A6B3D','#F2B33D']];
function theme(a,b){const r=document.documentElement.style;r.setProperty('--br',a);r.setProperty('--pk',b);$('#c1').value=a;$('#c2').value=b;LS.set('theme',[a,b])}
$('#theme').classList.toggle('hide',!CFG.picker);
$('#sw').innerHTML=THEMES.map((t,i)=>`<button data-i="${i}" title="${t[0]}" aria-label="${t[0]}" style="background:linear-gradient(135deg,${t[1]} 50%,${t[2]} 50%)"></button>`).join('');
$('#sw').onclick=e=>{const i=e.target.dataset.i;if(i!=null)theme(THEMES[i][1],THEMES[i][2])};
$('#c1').oninput=()=>theme($('#c1').value,$('#c2').value);$('#c2').oninput=()=>theme($('#c1').value,$('#c2').value);
{const t=LS.get('theme',null);theme(...(t||[THEMES[0][1],THEMES[0][2]]))}
load();
</script>
